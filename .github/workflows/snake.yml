name: 🐍 Generate Contribution Snake

on:
  # Refresh twice a day so the snake stays in sync with the contribution graph
  schedule:
    - cron: "0 */12 * * *"
  # Regenerate whenever the profile is updated
  push:
    branches:
      - master
  # Allow running it by hand from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate snake animations
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # NOTE: "#" is literal here — a block scalar has no YAML comments.
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00F5D4&color_dots=#161B22,#3C1E5E,#6D28D9,#A855F7,#00F5D4

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
