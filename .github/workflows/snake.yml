name: 🐍 Generate Contribution Snake

on:
  # Refresh twice a day so the snake stays in sync with the contribution graph
  schedule:
    - cron: "0 */12 * * *"
  # Regenerate whenever the profile is updated
  push:
    branches:
      - master
  # Allow running it by hand from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Needed for .github/scripts/polish_snake.py
      - uses: actions/checkout@v4

      - name: Generate snake animations
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # NOTE: "#" is literal here — a block scalar has no YAML comments.
          outputs: |
            dist/github-snake.svg?color_snake=#7C3AED&color_dots=#EBEDF0,#DDD6FE,#A78BFA,#7C3AED,#5B21B6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00F5D4&color_dots=#161B22,#3C1E5E,#6D28D9,#A855F7,#00F5D4

      # Platane/snk is a Docker action, so it writes dist/ as root while every
      # other step runs as "runner". Without this the post-processing step can
      # read the SVGs but not write them back (PermissionError).
      - name: Take ownership of the generated files
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist
          ls -la dist

      # Crops the off-grid parking row above the grid and adds the neon cycle.
      # Lives in a file rather than a heredoc so it can be tested verbatim.
      - name: Crop off-grid space and add animated neon colours
        run: python3 .github/scripts/polish_snake.py

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
